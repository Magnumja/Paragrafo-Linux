name: Linux checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-por fonts-dejavu
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          cargo --version
      - name: Hygiene, lint and tests (live inference skips without Ollama)
        run: ./scripts/check.sh
      - name: Release build
        run: cargo build --release --locked
      - name: Binary size budget
        run: test "$(du -k target/release/paragrafo | cut -f1)" -lt 51200
